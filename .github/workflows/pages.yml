name: Site

# Publishes site/ to https://zxcli.com. The command list on the page is read
# from the same zxcli.json the binary embeds, so it is copied in at deploy time.
on:
  push:
    branches: [main]
    paths: ['site/**', 'zxcli.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp zxcli.json site/zxcli.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
